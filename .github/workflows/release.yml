name: Release

on:
  push:
    tags:
      - 'nfc-v*'

# Two quick tags must not race each other to npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    # Only upstream publishes @withme/nfc: a fork that pushes an nfc-v* tag
    # skips this job instead of trying (and failing) to publish it.
    if: github.repository == 'vibe-with-me/withme-starter'
    runs-on: ubuntu-latest
    # The `npm` environment is the publish gate: it only deploys from
    # nfc-v* tags, holds NPM_TOKEN as an environment secret, and (once the
    # repo is public) waits for a maintainer to approve the run. npm's
    # trusted-publisher config must name this same environment.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail a mistagged push in seconds, before any heavy work.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#nfc-v}"
          PKG_VERSION="$(jq -r .version packages/nfc-sdk/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Gate on the package being shipped; the full suite (incl. RLS tests
      # against Supabase local) runs in ci.yml on every push.
      - name: Build @withme/nfc
        run: bunx turbo run build --filter=@withme/nfc

      - name: Test @withme/nfc
        run: bunx turbo run test --filter=@withme/nfc

      - name: Check publish artifacts
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      # npm (not bun) for publishing: provenance requires npm >= 9.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish @withme/nfc to npm
        working-directory: packages/nfc-sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "@withme/nfc ${GITHUB_REF_NAME#nfc-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
