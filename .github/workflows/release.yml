name: Release

on:
  push:
    tags:
      - 'nfc-v*'

# Two quick tags must not race each other to npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    # Only upstream publishes @vibewithme/nfc: a fork that pushes an nfc-v* tag
    # skips this job instead of trying (and failing) to publish it.
    if: github.repository == 'vibe-with-me/withme-starter'
    runs-on: ubuntu-latest
    # The `npm` environment is the publish gate: it only deploys from
    # nfc-v* tags and (once the repo is public) waits for a maintainer to
    # approve the run. npm's trusted-publisher config for @vibewithme/nfc
    # names this workflow file and this environment; renaming either
    # breaks the publish.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail a mistagged push in seconds, before any heavy work.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#nfc-v}"
          PKG_VERSION="$(jq -r .version packages/nfc-sdk/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Gate on the package being shipped; the full suite (incl. RLS tests
      # against Supabase local) runs in ci.yml on every push.
      - name: Build @vibewithme/nfc
        run: bunx turbo run build --filter=@vibewithme/nfc

      - name: Test @vibewithme/nfc
        run: bunx turbo run test --filter=@vibewithme/nfc

      - name: Check publish artifacts
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      # npm (not bun) for publishing. No token: npm trusted publishing
      # exchanges this job's OIDC token, which needs npm >= 11.5.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$NPM_VERSION" || { echo "npm $NPM_VERSION is older than 11.5.1" >&2; exit 1; }

      - name: Publish @vibewithme/nfc to npm
        working-directory: packages/nfc-sdk
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "@vibewithme/nfc ${GITHUB_REF_NAME#nfc-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
