name: Release

on:
  push:
    tags:
      - 'nfc-v*'

# Two quick tags must not race each other to npm.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Fail a mistagged push in seconds, before any heavy work.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#nfc-v}"
          PKG_VERSION="$(jq -r .version packages/nfc-sdk/package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Gate on the package being shipped; the full suite (incl. RLS tests
      # against Supabase local) runs in ci.yml on every push.
      - name: Build @withme/nfc
        run: bunx turbo run build --filter=@withme/nfc

      - name: Test @withme/nfc
        run: bunx turbo run test --filter=@withme/nfc

      - name: Check publish artifacts
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      # npm (not bun) for publishing: provenance requires npm >= 9.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish @withme/nfc to npm
        working-directory: packages/nfc-sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "@withme/nfc ${GITHUB_REF_NAME#nfc-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
