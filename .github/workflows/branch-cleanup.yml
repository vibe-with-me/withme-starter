name: Branch cleanup

# GitHub's "Automatically delete head branches" setting deletes a branch
# when its PR merges, but leaves it behind when the PR is closed without
# merging. This deletes that branch too, so the remote stays down to main
# plus branches with live work. Nothing is lost: GitHub keeps every PR's
# commits at refs/pull/<n>/head, and the branch can be restored from the
# PR page.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  closed-pr:
    # Merged PRs are the setting's job. PRs from forks have no branch here
    # to delete (and a read-only token).
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Delete the closed PR's head branch
        run: |
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then exit 0; fi
          # Deleting a branch through the API closes every open PR based on
          # it, so a branch that a stacked PR still targets stays.
          stacked=$(gh api "repos/$REPO/pulls?state=open&base=$BRANCH&per_page=1" --jq length)
          if [ "$stacked" -gt 0 ]; then
            echo "Keep $BRANCH: an open PR is based on it"
            exit 0
          fi
          # 404/422: the branch is already gone.
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" \
            && echo "Deleted $BRANCH" \
            || echo "$BRANCH was already deleted"
