name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check publish artifacts (@withme/nfc)
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2

      - name: Start Supabase (for RLS tests)
        run: supabase start -x studio,mailpit

      - name: Test
        run: bun run test

      # NOTE: the Playwright web smoke is intentionally NOT in CI yet. It hangs
      # deterministically on a cold dev server (the first non-redirecting
      # /t/<claimed> SSR render stalls under `vite dev` + the Cloudflare plugin;
      # see apps/web/playwright.config.ts). Reintroduce it once that dev-SSR
      # stall is root-caused, ideally running against the production build
      # rather than the dev server. Until then, run `bun run test:e2e` locally.
