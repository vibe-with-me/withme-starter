name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check publish artifacts (@vibewithme/nfc)
        run: bun run --cwd packages/nfc-sdk check:publish

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start Supabase (for RLS tests)
        run: supabase start -x studio,mailpit

      # The test helpers have no service-role key in source; hand them the
      # local stack's own, as docs/local-development.md does.
      - name: Export the local service-role key
        run: |
          key="$(supabase status -o env --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | sed -n 's/^SUPABASE_SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Test
        run: bun run test

      # Re-runs the unit suites with lcov and totals them (scripts/coverage.ts).
      # The table lands on the run page; on main, the badge job publishes the
      # number behind the README's coverage pill.
      - name: Coverage
        run: bun run coverage

      - name: Upload coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage/badge.json
          retention-days: 1

  # Publishes coverage/badge.json to the `badges` branch, which holds that
  # one file and nothing else (force-pushed, so it never grows a history).
  # The README's pill reads it through shields.io. A fork gets its own pill
  # with no setup: this runs in whichever repository main belongs to.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge

      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge.json
          git commit -q -m "coverage $(jq -r .message badge.json) for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # The browser suite is its own job so a red check says which kind of
  # breakage it is: `ci` is lint, types, build and the unit and database
  # tests; `e2e` is a user flow that no longer works in a real browser
  # against the production build. They run side by side, so the split costs
  # a second install and stack start, not wall-clock time.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start Supabase
        run: supabase start -x studio,mailpit

      - name: Export the local service-role key
        run: |
          key="$(supabase status -o env --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | sed -n 's/^SUPABASE_SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # Each test is named for the user flow it walks, and the github
      # reporter puts a failure on the PR's Files tab at the failing line.
      - name: Web e2e (production build in workerd)
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          bun run --cwd apps/web test:e2e

      # playwright-report/index.html is the readable one: every test, the
      # failing step, its screenshot, and the trace one click away. Download
      # the artifact, unzip, and run `bunx playwright show-report <dir>`.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
