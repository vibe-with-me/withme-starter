name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check publish artifacts (@withme/nfc)
        run: |
          bunx publint packages/nfc-sdk
          bunx @arethetypeswrong/cli --pack packages/nfc-sdk --profile node16

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start Supabase (for RLS tests)
        run: supabase start -x studio,mailpit

      # The test helpers have no service-role key in source; hand them the
      # local stack's own, as docs/local-development.md does.
      - name: Export the local service-role key
        run: |
          key="$(supabase status -o env --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | sed -n 's/^SUPABASE_SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Test
        run: bun run test

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Web smoke (production build in workerd)
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          bun run --cwd apps/web test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
