name: Skill proposal
description: Propose a new skill in .agents/skills, or a change to an existing one.
labels: [skill]
body:
  - type: markdown
    attributes:
      value: |
        A skill is a runbook that applies the slice (docs/the-slice.md) to one
        concern a fork repeats. Read docs/skills-roadmap.md first: it records
        the skills that exist and the ones deliberately skipped, and why.
        Anything that ranks, recommends, aggregates, or monetizes is off-thesis
        for this repo. CONTRIBUTING.md has the rest.
  - type: input
    id: name
    attributes:
      label: Skill name
      placeholder: e.g. add-reactions
    validations:
      required: true
  - type: textarea
    id: move
    attributes:
      label: The move it captures
      description: What a fork wants to do, and which forks (real or from the README's ideas table) have needed it.
    validations:
      required: true
  - type: textarea
    id: slice
    attributes:
      label: The layers it walks
      description: Contract, migration + RLS, RLS tests, API, web, mobile, e2e. Which ones change, and what changes in each?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety model
      description: |
        Which promises in docs/safety-model.md does it touch? For any new read
        or write path: what does a stranger see, and what does a blocked party
        see? Which RLS test proves it?
    validations:
      required: true
  - type: checkboxes
    id: thesis
    attributes:
      label: Fit
      options:
        - label: It does not rank, recommend, aggregate, or monetize, and adds no browse or search surface.
          required: true
        - label: I checked docs/skills-roadmap.md and it is not on the skipped list (or I explain why it should come back).
          required: true
