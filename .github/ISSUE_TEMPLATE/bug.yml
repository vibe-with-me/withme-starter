name: Bug
description: Something the starter does wrong on the demo, in a fork, or on a deploy.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before filing: is it one of the known fresh-machine problems in
        [Local development](https://github.com/vibe-with-me/withme-starter/blob/main/docs/local-development.md#when-something-goes-wrong)?
        If the bug lets someone see a card, a connection, or a gathering they
        should not, do not file it here. Report it privately on the Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected. One bug per issue.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      description: Which layer of the slice the bug lives in, as best you can tell.
      multiple: true
      options:
        - Contract (packages/contract)
        - Database, migration, or RLS (supabase/, packages/db)
        - API (apps/api)
        - Web (apps/web)
        - Mobile (apps/mobile)
        - NFC SDK (packages/nfc-sdk)
        - A skill (.agents/skills/)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: On the local demo if you can (`bun run db:reset && bun run db:seed`, then the steps). Say which demo account or tag UID you used.
      placeholder: |
        1. bun run db:reset && bun run db:seed
        2. Sign in as ada@demo.withme.local
        3. Open /t/04BBBBBBBBBBBB
        4. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Local demo, a fork (which skills have run), or a deploy. Bun and Supabase CLI versions, OS, browser or device.
      placeholder: |
        Local demo, main at <sha>. Bun 1.3.10, Supabase CLI 2.120.0, macOS, Safari.
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Does the gate pass?
      description: Output of `bun run lint && bun run typecheck && bun run test` on your checkout, if it is relevant. Paste the failing part only.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This bug does not let anyone see a card, a connection, or a gathering they should not. (If it does, close this and report it privately.)
          required: true
