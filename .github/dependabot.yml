version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Bun's text lockfile (bun.lock, Bun >= 1.1.39) is supported; the root
  # covers every workspace. Minor and patch bumps arrive as one grouped PR.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
