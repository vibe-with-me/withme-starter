# Ports are deliberately non-default (55xxx) so this stack can run alongside
# another local Supabase project (e.g. a production app on the 54xxx defaults).
project_id = "withme-starter"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[realtime]
enabled = false

# Avatars live in Storage. The `avatars` bucket and its policies come from
# supabase/migrations/20261011120000_avatars.sql (so a hosted project gets
# them from `supabase db push`), not from a [storage.buckets] entry here.
# Image transformation stays off: clients resize to 512px themselves, and
# imgproxy would be one more container for nothing.
[storage]
enabled = true

[storage.image_transformation]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Phone sign-in: a 6-digit code by text, no password. Signing in with a new
# number creates the account. Twilio Verify sends the codes.
[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "30s"

# +1 555-555-0100 (a fictional number) always takes 123456 and never reaches
# Twilio, so local dev and CI need no Twilio account. Leave it out of a
# hosted project.
[auth.sms.test_otp]
15555550100 = "123456"

# Twilio Verify. It has to stay enabled even locally: the CLI turns phone
# login off when no SMS provider is. Unset env vars are passed through as
# placeholders, so only real numbers fail without them. For real texts, put
# the Account SID (AC...), Verify Service SID (VA...) and Auth Token in
# supabase/.env, or in the dashboard for a hosted project.
[auth.sms.twilio_verify]
enabled = true
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_VERIFY_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_VERIFY_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_VERIFY_AUTH_TOKEN)"

# Google OAuth: set client_id/secret via env in supabase/.env or the dashboard
# for hosted projects. Disabled by default for zero-cloud-account local dev.
[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
