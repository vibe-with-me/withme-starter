# After sign-in or sign-up: iOS may offer to save the password, and while
# its sheet is up the app's own elements are hidden. Wait for the tabs or
# the sheet, decline the sheet if it came, then the tabs must be there.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: 'Connections|Not Now'
    timeout: 20000
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: Connections
    timeout: 10000
