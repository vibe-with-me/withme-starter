# Opens the app on the sign-in screen, whatever state the last run left.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    stopApp: true
- runFlow:
    file: open-link.yaml
    env:
      LINK: ${OPEN_URL}
# Expo Go's first-run dev-menu card; absent in a dev build.
- tapOn:
    text: Continue
    optional: true
# Signed in from a previous run (in the app, or held on the terms re-ask
# screen), or signed out: wait for any. The first open after Metro starts
# waits for the whole bundle.
- extendedWaitUntil:
    visible: 'Profile|Updated terms|New here\? Create an account|SDK version: .*'
    timeout: 120000
# Expo Go 57+ opens its developer menu over the app on a project's first
# load instead of the card above; close it.
- runFlow:
    when:
      visible: 'SDK version: .*'
    commands:
      - tapOn:
          id: xmark
      - extendedWaitUntil:
          visible: 'Profile|Updated terms|New here\? Create an account'
          timeout: 30000
- tapOn:
    text: Continue
    optional: true
- runFlow:
    when:
      visible: Profile
    file: sign-out.yaml
# The re-ask screen has no tabs; its own Account section signs out.
- runFlow:
    when:
      visible: Updated terms
    commands:
      - scrollUntilVisible:
          element: Sign out
          direction: DOWN
      - tapOn: Sign out
- extendedWaitUntil:
    visible: 'New here\? Create an account'
    timeout: 60000
