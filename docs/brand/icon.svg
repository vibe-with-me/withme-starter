<?xml version="1.0" encoding="UTF-8"?>
<!-- withme starter app icon, light. Colors are the light tokens in
     apps/web/src/styles/tokens.css: bg #f3efe8, ink #1c1916, accent #c2410c.
     Edit the colors here and in icon-dark.svg, then run docs/brand/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#f3efe8"/>
  <!-- One person reaching out (dot + arcs) to the person they meet (accent dot). -->
  <g fill="none" stroke="#1c1916" stroke-width="32" stroke-linecap="round">
    <path d="M410.6 617.8A180 180 0 0 0 410.6 406.2"/>
    <path d="M477.0 644.5A250 250 0 0 0 477.0 379.5"/>
    <path d="M547.5 662.2A320 320 0 0 0 547.5 361.8"/>
  </g>
  <circle cx="265" cy="512" r="112" fill="#1c1916"/>
  <circle cx="759" cy="512" r="112" fill="#c2410c"/>
</svg>
