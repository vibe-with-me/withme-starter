  <text x="640" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="88" fill="#1c1916" letter-spacing="-2">withme-starter</text>
  <text x="640" y="494" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#6f6a62">Tap a tag. Meet a person. Stay connected.</text>
