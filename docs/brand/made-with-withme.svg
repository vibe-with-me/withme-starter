<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" role="img" aria-label="Made with withme">
  <title>Made with withme</title>
  <!-- Colors are the starter's light tokens: ink #1c1916, surface #fffefb, bg #f3efe8. -->
  <clipPath id="r"><rect width="128" height="20" rx="4"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="66" height="20" fill="#1c1916"/>
    <rect x="66" width="62" height="20" fill="#f3efe8"/>
  </g>
  <rect x="0.5" y="0.5" width="127" height="19" rx="3.5" fill="none" stroke="#1c1916" stroke-opacity="0.25"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">
    <text x="33" y="14" fill="#fffefb">made with</text>
    <text x="97" y="14" fill="#1c1916" font-weight="700">withme</text>
  </g>
</svg>
